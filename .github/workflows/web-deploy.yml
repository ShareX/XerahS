name: XerahS Cloud Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xerahs-cloud
  cancel-in-progress: false

jobs:
  deploy-cloud:
    environment: xerahs-cloud-staging
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Direct (unpooled) connection to this environment's branch of the
      # Neon project xerahs-cloud, used only for migrations.
      DATABASE_URL_UNPOOLED: ${{ secrets.NEON_DATABASE_URL_UNPOOLED }}
      XERAHS_DESKTOP_OAUTH_CLIENT_ID: ${{ vars.XERAHS_DESKTOP_OAUTH_CLIENT_ID }}
      APP_ENV: staging
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: node scripts/db-migrate.ts --dir db/cloud/migrations
      - run: node scripts/register-desktop-oauth-client.ts
      # Stable staging has a dedicated Vercel project. It must use that
      # project's production target because Vercel Cron skips Preview builds.
      - run: pnpm dlx vercel@59.4.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: pnpm dlx vercel@59.4.0 build --prod --token="$VERCEL_TOKEN"
      - id: deploy
        shell: bash
        run: |
          url=$(pnpm dlx vercel@59.4.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - run: pnpm dlx vercel@59.4.0 inspect "${{ steps.deploy.outputs.url }}" --wait --timeout=5m --token="$VERCEL_TOKEN"
      - name: Smoke test cloud origin
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors "${{ steps.deploy.outputs.url }}/api/healthz"
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$APP_ORIGIN/api/healthz"
