name: XerahS Cloud Platform Drift

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: xerahs-cloud-staging
          - environment: xerahs-cloud-production
    environment: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_CONFIG_READ_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_LEDGER_BUCKET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      # The drift check only means something for an environment that actually
      # runs the Cloudflare R2 ledger. R2_LEDGER_BUCKET is optional in
      # web/src/lib/env.ts and the ledger stays disabled while it is unset, so
      # production has no ledger bucket and no drift-check configuration at all.
      # Enforcing production unconditionally failed every scheduled run on the
      # missing-variable assertion in web/scripts/verify-cloudflare-r2.mjs,
      # before any Cloudflare call. Both environments therefore follow the
      # staging precedent from ebe39dc4 ("[v0.31.0] [Build] Skip unconfigured
      # staging platform drift check"): enforce the desired state when the
      # environment is configured, skip with a notice when it is not.
      # Provisioning a production ledger bucket and wiring its secrets is a
      # separate owner decision (Mike); until then this skip is expected.
      - name: Verify Cloudflare R2 desired state
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.R2_BUCKET != '' }}
        shell: bash
        run: node web/scripts/verify-cloudflare-r2.mjs
      - name: Skip unconfigured Cloudflare R2 drift check
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' || env.R2_BUCKET == '' }}
        shell: bash
        run: echo "::notice::Skipping Cloudflare R2 drift check for ${{ matrix.environment }} until its GitHub environment configuration is connected."
