name: Markdown Hygiene

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions: read-all

jobs:
  markdown-hygiene:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Run Markdown hygiene check
        run: python scripts/check-markdown-mojibake.py
        # CI must fail on remaining BOM/mojibake. Local pre-commit strips UTF-8 BOM
        # from staged Markdown; changelog writers must use UTF-8 without BOM.
