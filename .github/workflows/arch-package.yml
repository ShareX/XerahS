name: Arch package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'build/linux/**'
      - 'build/verify-submodules.sh'
      - 'build/tests/verify-submodules.sh'
      - 'build/tests/shutdown-build-servers.sh'
      - '.gitmodules'
      - 'ShareX.ImageEditor'
      - 'Omacut'
      - 'native/omasnap'
      - '.github/workflows/arch-package.yml'
  push:
    branches: [develop]
    paths:
      - 'build/linux/**'
      - 'build/verify-submodules.sh'
      - 'build/tests/verify-submodules.sh'
      - 'build/tests/shutdown-build-servers.sh'
      - '.gitmodules'
      - 'ShareX.ImageEditor'
      - 'Omacut'
      - 'native/omasnap'
      - '.github/workflows/arch-package.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 60
    steps:
      - name: Install container prerequisites
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install declared build dependencies
        shell: bash
        run: |
          source build/linux/aur/xerahs-git/PKGBUILD
          pacman -S --noconfirm --needed "${depends[@]}" "${makedepends[@]}"
      - name: Create unprivileged package builder
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Check dependency guard and generated metadata
        working-directory: build/linux/aur/xerahs-git
        run: |
          runuser -u builder -- bash ../../../tests/verify-submodules.sh
          runuser -u builder -- bash ../../../tests/shutdown-build-servers.sh
          runuser -u builder -- makepkg --printsrcinfo > /tmp/xerahs.SRCINFO
          diff -u .SRCINFO /tmp/xerahs.SRCINFO
      - name: Build package from the checked-out revision
        working-directory: build/linux/aur/xerahs-git
        run: |
          runuser -u builder -- env XERAHS_REPO_ROOT="$GITHUB_WORKSPACE" \
            makepkg --cleanbuild --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: xerahs-arch-package
          path: build/linux/aur/xerahs-git/*.pkg.tar.zst
          if-no-files-found: error
