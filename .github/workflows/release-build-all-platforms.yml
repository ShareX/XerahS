name: Release Build (All Platforms)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FREEDESKTOP_RUNTIME_VERSION: "25.08"

jobs:
  validate-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_title: ${{ steps.version.outputs.release_title }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Resolve version
        shell: bash
        run: |
          VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props | tr -d '[:space:]')
          if [[ -z "$VERSION" ]]; then
            echo "Failed to resolve <Version> from Directory.Build.props"
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version '$VERSION' must follow x.y.z format."
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Tag '${GITHUB_REF_NAME}' must follow vX.Y.Z format."
              exit 1
            fi

            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$VERSION" != "$TAG_VERSION" ]]; then
              echo "Tag version '$TAG_VERSION' does not match Directory.Build.props version '$VERSION'"
              exit 1
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_title=XerahS $VERSION" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: validate-version
    # One job per architecture, in parallel. Both used to run back to back in one job (~17 min).
    strategy:
      fail-fast: false
      matrix:
        arch: [win-x64, win-arm64]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $isccPath = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (!(Test-Path $isccPath)) {
            choco install innosetup --no-progress -y
          }
          if (!(Test-Path $isccPath)) {
            throw "Inno Setup Compiler (ISCC.exe) was not found after installation."
          }

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          $wixVersion = "6.0.2"
          $toolList = dotnet tool list --global 2>&1
          if ($toolList | Select-String 'wix') {
            dotnet tool update --global wix --version $wixVersion
          } else {
            dotnet tool install --global wix --version $wixVersion
          }
          # Ensure dotnet tools directory is on PATH for subsequent steps.
          $dotnetTools = Join-Path $env:USERPROFILE ".dotnet\tools"
          "$dotnetTools" | Out-File -Append -FilePath $env:GITHUB_PATH
          $env:PATH = "$dotnetTools;$env:PATH"
          wix --version
          $extensions = wix extension list --global 2>&1
          if (!($extensions | Select-String 'WixToolset.UI.wixext')) {
            wix extension add --global "WixToolset.UI.wixext/$wixVersion"
          }

      - name: Test portable archive packaging
        shell: pwsh
        run: .\build\windows\test-package-portable.ps1

      - name: Build Windows packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/logs | Out-Null
          $logPath = "build/logs/windows-${{ matrix.arch }}-build.log"
          Start-Transcript -Path $logPath -Force | Out-Null
          try {
            .\build\windows\package-windows.ps1 -Architectures ${{ matrix.arch }}
          }
          finally {
            Stop-Transcript | Out-Null
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/XerahS-${{ needs.validate-version.outputs.version }}-${{ matrix.arch }}.exe
            dist/XerahS-${{ needs.validate-version.outputs.version }}-${{ matrix.arch }}.msi
            dist/XerahS-${{ needs.validate-version.outputs.version }}-${{ matrix.arch }}-portable.zip

      - name: Upload Windows build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log-${{ matrix.arch }}
          if-no-files-found: warn
          path: build/logs/windows-${{ matrix.arch }}-build.log

  build-macos:
    needs: validate-version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build macOS packages
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/logs
          chmod +x ./build/macos/package-mac.sh
          ./build/macos/package-mac.sh 2>&1 | tee build/logs/macos-build.log

      - name: Validate macOS archives
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate-version.outputs.version }}"
          for ARCH in arm64 x64; do
            ARCHIVE="dist/XerahS-${VERSION}-mac-${ARCH}.tar.gz"
            ARCHIVE_LIST="$(mktemp)"
            tar -tzf "$ARCHIVE" > "$ARCHIVE_LIST"
            grep -q "XerahS.app/Contents/MacOS/xerahs-watchfolder-daemon" "$ARCHIVE_LIST"
            # runtimeconfig sidecar is embedded in the single-file binary on macOS
            # (see XerahS.App.csproj PublishWatchFolderDaemon / package-mac.sh).
            rm -f "$ARCHIVE_LIST"
          done

      - name: Smoke test native macOS startup
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s build/ci -p 'test_smoke_desktop_startup.py'
          case "$(uname -m)" in
            arm64) ARCH=arm64 ;;
            x86_64) ARCH=x64 ;;
            *) echo "Unsupported macOS runner architecture" >&2; exit 1 ;;
          esac
          SMOKE_ROOT="$(mktemp -d)"
          trap 'rm -rf "$SMOKE_ROOT"' EXIT
          tar -xzf "dist/XerahS-${{ needs.validate-version.outputs.version }}-mac-${ARCH}.tar.gz" -C "$SMOKE_ROOT"
          python3 -B build/ci/smoke_desktop_startup.py \
            --app-bundle "$SMOKE_ROOT/XerahS.app" \
            --output-log build/logs/macos-startup.log

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          if-no-files-found: error
          path: |
            dist/XerahS-${{ needs.validate-version.outputs.version }}-mac-arm64.tar.gz
            dist/XerahS-${{ needs.validate-version.outputs.version }}-mac-x64.tar.gz

      - name: Upload macOS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-log
          if-no-files-found: warn
          path: |
            build/logs/macos-build.log
            build/logs/macos-startup.log

  # OmaSnap capture engine (XIP0088), bundled in the Linux x64 tarball so XerahS works out of
  # the box on Omarchy/Hyprland. Ubuntu 24.04 ships Qt 6.4, so OmaSnap is built in an Arch
  # container (its target platform). Required: a missing submodule or dependency fails the
  # release. deb, rpm, AppImage and Flatpak do not include it.
  build-omasnap:
    needs: validate-version
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install OmaSnap build dependencies
        shell: bash
        run: |
          pacman -Syu --noconfirm --needed git base-devel cmake ninja pkgconf qt6-base layer-shell-qt \
            wayland wayland-protocols libdeflate

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build OmaSnap
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p "$RUNNER_TEMP/omasnap-stage"
          OMASNAP_REQUIRED=1 ./build/linux/build-omasnap.sh "$RUNNER_TEMP/omasnap-stage"

      - name: Upload OmaSnap stage
        uses: actions/upload-artifact@v4
        with:
          name: omasnap-linux-x64
          if-no-files-found: error
          path: ${{ runner.temp }}/omasnap-stage

  build-linux:
    needs: [validate-version, build-omasnap]
    if: ${{ !cancelled() && needs.validate-version.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
            artifact_name: linux-release-x64
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            artifact_name: linux-release-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Linux packaging tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm desktop-file-utils squashfs-tools file xvfb \
            libx11-6 libx11-xcb1 libice6 libsm6 libfontconfig1 libgl1 libxcursor1 \
            libxrandr2 libxi6 libxinerama1

      - name: Download optional OmaSnap stage
        if: matrix.rid == 'linux-x64'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: omasnap-linux-x64
          path: ${{ runner.temp }}/omasnap-stage

      - name: Restore OmaSnap executable bit
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          # upload-artifact@v4 + download-artifact@v4 occasionally drop the +x
          # bit on the extracted omasnap binary. Reapply it so the executable
          # check in Build Linux packages sees it as runnable.
          chmod +x "$RUNNER_TEMP/omasnap-stage/omasnap/omasnap" 2>/dev/null || true

      - name: Build Linux packages
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/logs
          chmod +x ./build/linux/package-linux.sh
          if [ -x "$RUNNER_TEMP/omasnap-stage/omasnap/omasnap" ]; then
            export XERAHS_OMASNAP_STAGE_DIR="$RUNNER_TEMP/omasnap-stage"
          fi
          XERAHS_ARCHITECTURES="${{ matrix.rid }}" ./build/linux/package-linux.sh 2>&1 | tee "build/logs/linux-${{ matrix.rid }}-build.log"

      - name: Validate Linux archive
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate-version.outputs.version }}"
          ARCHIVE="dist/XerahS-${VERSION}-${{ matrix.rid }}.tar.gz"
          ARCHIVE_LIST="$(mktemp)"
          tar -tzf "$ARCHIVE" > "$ARCHIVE_LIST"
          grep -Eq '(^|/)xerahs-watchfolder-daemon$' "$ARCHIVE_LIST"
          grep -Eq '(^|/)xerahs-watchfolder-daemon.runtimeconfig.json$' "$ARCHIVE_LIST"
          # OmaSnap is bundled in the linux-x64 tarball (XIP0088); other architectures ship without it.
          if [ "${{ matrix.rid }}" = "linux-x64" ] || grep -Eq '(^|/)omasnap/' "$ARCHIVE_LIST"; then
            for entry in omasnap/omasnap omasnap/licenses/LICENSE-MIT omasnap/licenses/LICENSE-OFL omasnap/licenses/LICENSE-ISC; do
              grep -Eq "(^|/)${entry}\$" "$ARCHIVE_LIST" || { echo "::error::Incomplete OmaSnap bundle: missing ${entry}"; exit 1; }
            done
          fi
          rm -f "$ARCHIVE_LIST"
          # The packager logs "Skipped RPM package" and exits 0 when rpmbuild fails; fail here
          # instead of 15 minutes later in the release job's asset validator.
          for package in deb rpm; do
            if [ ! -f "dist/XerahS-${VERSION}-${{ matrix.rid }}.${package}" ]; then
              echo "::error::Missing dist/XerahS-${VERSION}-${{ matrix.rid }}.${package}; see the Build Linux packages log."
              exit 1
            fi
          done

      - name: Validate AppImage
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate-version.outputs.version }}"
          APPIMAGE="dist/XerahS-${VERSION}-${{ matrix.rid }}.AppImage"
          test -f "$APPIMAGE"
          chmod +x "$APPIMAGE"
          file "$APPIMAGE" | grep -Ei 'ELF|executable'
          WORKDIR="$(mktemp -d)"
          cp "$APPIMAGE" "$WORKDIR/XerahS.AppImage"
          chmod +x "$WORKDIR/XerahS.AppImage"
          (cd "$WORKDIR" && APPIMAGE_EXTRACT_AND_RUN=1 ./XerahS.AppImage --appimage-extract)
          test -x "$WORKDIR/squashfs-root/AppRun"
          test -x "$WORKDIR/squashfs-root/usr/lib/xerahs/XerahS"
          test -f "$WORKDIR/squashfs-root/xerahs.desktop"
          test -f "$WORKDIR/squashfs-root/xerahs.png"
          grep -q '^Name=XerahS$' "$WORKDIR/squashfs-root/xerahs.desktop"
          echo "Launching extracted AppImage payload under Xvfb..."
          set +e
          timeout 25s xvfb-run -a "$WORKDIR/squashfs-root/AppRun"
          status=$?
          set -e
          # 0 = clean exit; 124 = still running when timeout fired (GUI started).
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "AppImage failed to start (exit $status)"
            exit 1
          fi
          echo "AppImage start check passed (exit $status)."
          rm -rf "$WORKDIR"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            dist/XerahS-${{ needs.validate-version.outputs.version }}-${{ matrix.rid }}.tar.gz
            dist/XerahS-${{ needs.validate-version.outputs.version }}-${{ matrix.rid }}.deb
            dist/XerahS-${{ needs.validate-version.outputs.version }}-${{ matrix.rid }}.rpm
            dist/XerahS-${{ needs.validate-version.outputs.version }}-${{ matrix.rid }}.AppImage

      - name: Upload Linux build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-log-${{ matrix.rid }}
          if-no-files-found: warn
          path: build/logs/linux-${{ matrix.rid }}-build.log

  build-flatpak:
    needs: validate-version
    runs-on: ubuntu-24.04
    # NOTE: ARM64 Flatpak builds require an ARM64 runner (or QEMU) and are
    # better handled by Flathub's infrastructure. This job produces the x86_64
    # bundle only. To add ARM64: switch to ubuntu-24.04-arm and add QEMU user
    # static (binfmt-support) for cross-building.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Flatpak & flatpak-builder
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder desktop-file-utils

      - name: Install FreeDesktop runtime (one-time)
        shell: bash
        run: |
          set -euo pipefail
          flatpak remote-add --user --if-not-exists --no-gpg-verify flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --or-update --noninteractive \
            flathub \
            "org.freedesktop.Platform//${FREEDESKTOP_RUNTIME_VERSION}" \
            "org.freedesktop.Sdk//${FREEDESKTOP_RUNTIME_VERSION}"
          flatpak list --user --runtime | grep -E "org\.freedesktop\.(Platform|Sdk).*${FREEDESKTOP_RUNTIME_VERSION}"

      - name: Build Linux publish (staging for Flatpak)
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./build/linux/package-linux.sh
          # Flatpak does not bundle the OmaSnap Qt capture engine (see the
          # build-omasnap comment block above). Allow package-linux.sh to
          # skip OmaSnap instead of failing because Qt6 is absent here.
          XERAHS_ALLOW_NO_OMASNAP=1 XERAHS_SKIP_APPIMAGE=1 XERAHS_ARCHITECTURES="linux-x64" ./build/linux/package-linux.sh

      - name: Extract tarball to Flatpak staging dir
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate-version.outputs.version }}"
          # Remove any previous staging dir
          rm -rf "dist/xerahs-flatpak-staging"
          mkdir -p "dist/xerahs-flatpak-staging"
          # Extract the self-contained publish into the staging dir.
          # The tarball entries are already relative to the publish root.
          tar -xzf "dist/XerahS-${VERSION}-linux-x64.tar.gz" \
            -C "dist/xerahs-flatpak-staging"

      - name: Validate video editor audio library is present
        shell: bash
        run: |
          set -euo pipefail
          # The Omacut video editor plays audio through the bundled OpenAL Soft library.
          if ! find "dist/xerahs-flatpak-staging" -maxdepth 1 -name 'libopenal.so*' | grep -q .; then
            echo "Error: libopenal.so missing from dist/xerahs-flatpak-staging"
            echo "This means the Omacut submodule was not built. Ensure git submodules are initialized."
            exit 1
          fi

      - name: Validate and repair plugins in staging dir
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build/linux/repair-flatpak-plugins.sh
          ./build/linux/repair-flatpak-plugins.sh dist/xerahs-flatpak-staging linux-x64

      - name: Build Flatpak
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/logs dist/flatpak-repo
          flatpak-builder --user --force-clean --ccache \
            --repo=dist/flatpak-repo \
            build/com.xerahs.XerahS \
            flatpak/com.xerahs.XerahS.yml 2>&1 | tee build/logs/flatpak-build.log || {
            echo "flatpak-builder failed. Logs:"
            cat build/logs/flatpak-build.log
            exit 1
          }

      - name: Validate Flatpak
        shell: bash
        run: |
          set -euo pipefail
          test -f build/com.xerahs.XerahS/metadata
          test -x build/com.xerahs.XerahS/files/bin/xerahs
          test -f build/com.xerahs.XerahS/files/share/applications/com.xerahs.XerahS.desktop
          test -f build/com.xerahs.XerahS/files/share/icons/hicolor/512x512/apps/com.xerahs.XerahS.png
          test -f build/com.xerahs.XerahS/files/share/metainfo/com.xerahs.XerahS.metainfo.xml
          test -f dist/flatpak-repo/config

      - name: Export Flatpak bundle
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate-version.outputs.version }}"
          flatpak build-bundle dist/flatpak-repo \
            "dist/com.xerahs.XerahS-$VERSION-linux-x64.flatpak" \
            com.xerahs.XerahS

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-release
          if-no-files-found: error
          path: |
            dist/com.xerahs.XerahS-${{ needs.validate-version.outputs.version }}-linux-x64.flatpak

      - name: Upload Flatpak build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-build-log
          if-no-files-found: warn
          path: build/logs/flatpak-build.log

  release:
    if: github.ref_type == 'tag'
    needs:
      - validate-version
      - build-windows
      - build-macos
      - build-linux
      - build-flatpak
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Validate release matrix and generate metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate-version.outputs.version }}"
          python3 -B -m unittest discover -s build/ci -p 'test_validate_release_assets.py'
          python3 build/ci/validate_release_assets.py \
            --assets-dir release-assets \
            --version "$VERSION" \
            --metadata-output release-assets/release-metadata.json

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.validate-version.outputs.release_title }}
          # ShareX/XerahS: always pre-release. KovaForge/XerahS: full release (latest).
          prerelease: ${{ github.repository != 'KovaForge/XerahS' }}
          make_latest: ${{ github.repository == 'KovaForge/XerahS' }}
          files: |
            release-assets/XerahS-${{ needs.validate-version.outputs.version }}-win-x64.exe
            release-assets/XerahS-${{ needs.validate-version.outputs.version }}-win-x64.msi
            release-assets/XerahS-${{ needs.validate-version.outputs.version }}-win-arm64.exe
            release-assets/XerahS-${{ needs.validate-version.outputs.version }}-win-arm64.msi
            release-assets/XerahS-${{ needs.validate-version.outputs.version }}-win-x64-portable.zip
            release-assets/XerahS-${{ needs.validate-version.outputs.version }}-win-arm64-portable.zip
            release-assets/XerahS-${{ needs.validate-version.outputs.version }}-mac-arm64.tar.gz
            release-assets/XerahS-${{ needs.validate-version.outputs.version }}-mac-x64.tar.gz
            release-assets/XerahS-${{ needs.validate-version.outputs.version }}-linux-x64.tar.gz
            release-assets/XerahS-${{ needs.validate-version.outputs.version }}-linux-x64.deb
            release-assets/XerahS-${{ needs.validate-version.outputs.version }}-linux-x64.rpm
            release-assets/XerahS-${{ needs.validate-version.outputs.version }}-linux-x64.AppImage
            release-assets/XerahS-${{ needs.validate-version.outputs.version }}-linux-arm64.tar.gz
            release-assets/XerahS-${{ needs.validate-version.outputs.version }}-linux-arm64.deb
            release-assets/XerahS-${{ needs.validate-version.outputs.version }}-linux-arm64.rpm
            release-assets/XerahS-${{ needs.validate-version.outputs.version }}-linux-arm64.AppImage
            release-assets/com.xerahs.XerahS-${{ needs.validate-version.outputs.version }}-linux-x64.flatpak
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package-chocolatey:
    if: github.ref_type == 'tag'
    needs:
      - validate-version
      - release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Ensure Chocolatey CLI
        shell: pwsh
        run: |
          if (!(Get-Command choco -ErrorAction SilentlyContinue)) {
            throw "Chocolatey CLI (choco) is required on the runner."
          }

          choco --version

      - name: Test Chocolatey release metadata
        shell: pwsh
        run: .\build\windows\chocolatey\test-release-metadata.ps1

      - name: Sync and pack Chocolatey package
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .\build\windows\chocolatey\Sync-ChocolateyPackage.ps1 `
            -Version "${{ needs.validate-version.outputs.version }}" `
            -Repository "${{ github.repository }}" `
            -Pack `
            -OutputDirectory "dist\chocolatey"

      - name: Smoke test Chocolatey package
        shell: pwsh
        run: |
          .\build\windows\chocolatey\Test-ChocolateyPackage.ps1 `
            -Version "${{ needs.validate-version.outputs.version }}" `
            -SourceDirectory "dist\chocolatey"

      - name: Upload Chocolatey artifact
        uses: actions/upload-artifact@v4
        with:
          name: chocolatey-package-${{ needs.validate-version.outputs.version }}
          if-no-files-found: error
          path: dist/chocolatey/xerahs.${{ needs.validate-version.outputs.version }}.nupkg

      - name: Upload Chocolatey package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate-version.outputs.version }}
          # Keep Chocolatey upload aligned with the same repo release policy.
          prerelease: ${{ github.repository != 'KovaForge/XerahS' }}
          make_latest: ${{ github.repository == 'KovaForge/XerahS' }}
          files: dist/chocolatey/xerahs.${{ needs.validate-version.outputs.version }}.nupkg
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-linux-repos:
    if: github.ref_type == 'tag'
    needs:
      - validate-version
      - release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download linux-x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release-x64
          path: dist

      - name: Download linux-arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release-arm64
          path: dist

      - name: Install distro-repo tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev devscripts debhelper dput gnupg rpm python3-pip python3-setuptools
          python3 -m pip install --user copr-cli osc
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Publish PPA / COPR / OBS
        shell: bash
        env:
          LAUNCHPAD_PPA: ${{ secrets.LAUNCHPAD_PPA }}
          LAUNCHPAD_GPG_PRIVATE_KEY: ${{ secrets.LAUNCHPAD_GPG_PRIVATE_KEY }}
          LAUNCHPAD_GPG_PASSPHRASE: ${{ secrets.LAUNCHPAD_GPG_PASSPHRASE }}
          LAUNCHPAD_GPG_KEY_ID: ${{ secrets.LAUNCHPAD_GPG_KEY_ID }}
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          COPR_PROJECT: ${{ secrets.COPR_PROJECT }}
          OSC_USERNAME: ${{ secrets.OSC_USERNAME }}
          OSC_PASSWORD: ${{ secrets.OSC_PASSWORD }}
          OBS_PROJECT: ${{ secrets.OBS_PROJECT }}
        run: |
          chmod +x .ai/skills/publish-release/scripts/prepare-distro-repo-assets.sh \
                   .ai/skills/publish-release/scripts/publish-distro-repos.sh
          .ai/skills/publish-release/scripts/publish-distro-repos.sh \
            --tag "v${{ needs.validate-version.outputs.version }}" \
            --repo "${{ github.repository }}"
